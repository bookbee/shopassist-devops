# Root orchestration for the whole ShopAssist platform.
#
# Assumes all four project repos are checked out as siblings of this one:
#
#   some-folder/
#   ├── shopassist-devops/     (this repo)
#   ├── shopassist-database/
#   ├── shopassist-model/
#   ├── shopassist/             FastAPI backend  -> container/image "shopassist-api"
#   └── shopassist-client/         Web client -> container/image "shopassist-client"
#
# `include:` pulls in all four projects' own compose files unmodified -
# each stays fully self-contained and independently runnable via
# `docker compose up` from inside its own repo. This file only adds: a
# shared network so all four can reach each other, and the
# container-network URLs (`postgres:5432`, `ollama:11434`, `api:8000`)
# each of them would otherwise only know how to reach via
# `localhost`/`host.docker.internal`.
#
# Naming convention across all four containers/images: `shopassist-<role>`
# - shopassist-database -> container `shopassist-postgres` (Postgres is the
#   role; "shopassist-database" is the *project*, not the container)
# - shopassist-model     -> containers `shopassist-ollama` (the LLM host)
#   and `shopassist-model-bootstrap` (one-shot model-pull job)
# - shopassist            -> container/image `shopassist-api`
# - shopassist-client      -> container/image `shopassist-client` (same name,
#   project already named after its role)
include:
  - path: ../shopassist-database/docker-compose.yml
  - path: ../shopassist-model/docker-compose.yml
  - path: ../shopassist/docker-compose.yml
  - path: ../shopassist-client/docker-compose.yml

networks:
  shopassist-platform:
    name: shopassist-platform

services:
  # --- attach the included services to the shared platform network -------
  # Listed explicitly (not relying on Compose to merge/append the original
  # network list) so the end result is unambiguous regardless of merge
  # semantics: postgres/ollama/model-bootstrap/api/client all keep their
  # own project's network (so `docker compose up` still works from inside
  # each one's own repo standalone) *and* join shopassist-platform (so
  # they can reach each other here).
  postgres:
    networks:
      - shopassist-network
      - shopassist-platform

  ollama:
    networks:
      - shopassist-model-network
      - shopassist-platform

  model-bootstrap:
    networks:
      - shopassist-model-network
      - shopassist-platform

  # --- shopassist FastAPI backend -----------------------------------------
  # Everything below overrides shopassist/docker-compose.yml's standalone
  # defaults (host.docker.internal, no DATABASE_URL) with the real
  # container-network addresses now that every service shares the
  # shopassist-platform network - Compose merges `environment` key-by-key,
  # so only the keys listed here actually change.
  api:
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      OLLAMA_API_BASE_URL: http://ollama:11434
      # Must match shopassist-model/config/models.yaml - that file controls
      # what actually gets pulled, this just tells shopassist what to ask
      # for. Change SHOPASSIST_MODEL in .env if you change that file's
      # default, or these two projects will disagree about the model name.
      OLLAMA_ROUTER_MODEL: ${SHOPASSIST_MODEL:-llama3.2:3b-instruct}
      OLLAMA_AGENT_REASON_MODEL: ${SHOPASSIST_MODEL:-llama3.2:3b-instruct}
      OLLAMA_AGENT_INTERPRET_MODEL: ${SHOPASSIST_MODEL:-llama3.2:3b-instruct}
      OLLAMA_GENERATIVE_MODEL: ${SHOPASSIST_MODEL:-llama3.2:3b-instruct}
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      # shopassist and shopassist-database share the same schema
      # (customers/items/sessions/orders/order_items, cust-1001/item-1001/
      # ord-1001 IDs throughout) - see shopassist-database's
      # docs/database-design.md - so this is a real, working connection,
      # not a placeholder. Credentials match shopassist-database's own
      # .env.example defaults; override SHOPASSIST_DATABASE_* here if you
      # change those.
      DATABASE_URL: postgresql://${SHOPASSIST_DATABASE_USER:-shopassist}:${SHOPASSIST_DATABASE_PASSWORD:-shopassist123}@postgres:5432/${SHOPASSIST_DATABASE_NAME:-shopassist}
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - shopassist-api-network
      - shopassist-platform

  # --- shopassist-client storefront client ---------------------------------
  # Same idea as `api` above: overrides shopassist-client/docker-compose.yml's
  # standalone default (host.docker.internal) with the real container URL.
  client:
    ports:
      - "${WEB_PORT:-8501}:8501"
    environment:
      API_BASE_URL: http://api:8000
      APP_TITLE: ${APP_TITLE:-IISc Alumni Store}
      ENABLE_CHATBOT: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - shopassist-client-network
      - shopassist-platform
